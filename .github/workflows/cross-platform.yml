name: Cross-platform - 跨平台冒烟测试

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一 00:00 UTC 运行一次完整跨平台测试
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # Ubuntu 测试
  ubuntu-test:
    name: Ubuntu ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-latest]
        python-version: ['3.8', '3.10', '3.12']
        exclude:
          - os: ubuntu-20.04
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 编译检查
        run: |
          set -e
          find . -name "*.py" -not -path "*/__pycache__/*" | while read f; do
            python -m py_compile "$f"
          done
          echo "✓ Ubuntu 编译通过"

      - name: 单元测试
        run: |
          python scripts/tests/run_tests.py

      - name: CLI 冒烟测试
        run: |
          python novel-cli.py --help || true
          python scripts/check_text.py --help || true
          python scripts/init_book.py --help || true
          echo "✓ CLI 接口冒烟测试通过"

  # macOS 测试
  macos-test:
    name: macOS ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-latest]
        python-version: ['3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 编译检查
        run: |
          set -e
          find . -name "*.py" -not -path "*/__pycache__/*" | while read f; do
            python -m py_compile "$f"
          done
          echo "✓ macOS 编译通过"

      - name: 单元测试
        run: |
          python scripts/tests/run_tests.py

      - name: CLI 冒烟测试
        run: |
          python novel-cli.py --help || true
          python scripts/check_text.py --help || true
          python scripts/init_book.py --help || true
          echo "✓ macOS CLI 冒烟测试通过"

  # Windows 测试
  windows-test:
    name: Windows ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022, windows-latest]
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 编译检查
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter "*.py" -Recurse | Where-Object { $_.FullName -notmatch "__pycache__" }
          $failed = $false
          foreach ($f in $files) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $($f.FullName)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Windows 编译通过"

      - name: 单元测试
        shell: pwsh
        run: |
          python scripts/tests/run_tests.py

      - name: CLI 冒烟测试
        shell: pwsh
        run: |
          python novel-cli.py --help
          if ($LASTEXITCODE -ne 0) { Write-Host "note: help returned non-zero, continuing" }
          python scripts/check_text.py --help
          if ($LASTEXITCODE -ne 0) { Write-Host "note: help returned non-zero, continuing" }
          python scripts/init_book.py --help
          if ($LASTEXITCODE -ne 0) { Write-Host "note: help returned non-zero, continuing" }
          Write-Host "Windows CLI 冒烟测试通过"
