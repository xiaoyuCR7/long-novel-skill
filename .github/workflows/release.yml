name: Release - 发布与版本管理

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本验证
  version-check:
    name: 版本号一致性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 验证公开版本号一致
        run: python scripts/version_sync.py --check

      - name: 验证 Tag 与包版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(python -c "from scripts.config import SKILL_VERSION; print(SKILL_VERSION)")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

  # 运行完整测试套件
  full-test:
    name: 发布前完整测试
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行完整测试套件
        run: python scripts/tests/run_tests.py

      - name: 验证 Skill 契约
        env:
          PYTHONUTF8: "1"
        run: python scripts/skill_contract.py .

      - name: 验证公开版本号一致
        env:
          PYTHONUTF8: "1"
        run: python scripts/version_sync.py --check

  # 创建发布
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: full-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成变更日志
        id: changelog
        run: |
          # 发布说明指向此 tag 的真实版本记录，入口不承担更新日志职责。
          echo "changes=请查看 [CHANGELOG.md 对应版本](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: long-novel-skill ${{ github.ref_name }}
          body: |
            # long-novel-skill ${{ github.ref_name }}

            ## 安装方式

            **方式一：** 直接在支持 Skill 的 AI 客户端中安装：
            ```
            安装这个 skill <仓库地址>
            ```

            **方式二：** 克隆仓库后手动配置。

            ## 主要变更
            ${{ steps.changelog.outputs.changes }}

            ## 兼容性
            - Python: 3.8+
            - 支持平台: Claude Code, TRAE, Cursor, OpenCode, Codex, MCP Client
            - 零第三方依赖（纯标准库）

          draft: false
          prerelease: false
