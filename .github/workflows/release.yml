name: Release - 发布与版本管理

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本验证
  version-check:
    name: 版本号一致性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag 版本: $TAG_VERSION"

      - name: 验证 SKILL.md 版本
        run: |
          SKILL_VERSION=$(grep 'version:' SKILL.md | head -n 1 | sed 's/.*version: *//' | tr -d ' ')
          echo "SKILL.md 版本: $SKILL_VERSION"
          if [ "$SKILL_VERSION" != "${{ steps.version.outputs.tag_version }}" ]; then
            echo "✗ 版本号不一致: Tag=${{ steps.version.outputs.tag_version }}, SKILL.md=$SKILL_VERSION"
            exit 1
          fi
          echo "✓ SKILL.md 版本号一致"

      - name: 验证 skill.json 版本
        run: |
          if [ -f skill.json ]; then
            JSON_VERSION=$(python -c "import json; d=json.load(open('skill.json')); print(d.get('version',''))")
            echo "skill.json 版本: $JSON_VERSION"
            if [ -n "$JSON_VERSION" ] && [ "$JSON_VERSION" != "${{ steps.version.outputs.tag_version }}" ]; then
              echo "✗ skill.json 版本号不一致"
              exit 1
            fi
            echo "✓ skill.json 版本一致"
          else
            echo "⊘ skill.json 不存在，跳过"
          fi

  # 运行完整测试套件
  full-test:
    name: 发布前完整测试
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行完整测试套件
        run: |
          python scripts/tests/run_tests.py

  # 创建发布
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: full-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成变更日志
        id: changelog
        run: |
          # 从 SKILL.md 中提取最新版本的变更日志
          echo "changes=请查看 SKILL.md 中的更新日志" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: long-novel-skill ${{ github.ref_name }}
          body: |
            # long-novel-skill ${{ github.ref_name }}

            ## 安装方式

            **方式一：** 直接在支持 Skill 的 AI 客户端中安装：
            ```
            安装这个 skill <仓库地址>
            ```

            **方式二：** 克隆仓库后手动配置。

            ## 主要变更
            ${{ steps.changelog.outputs.changes }}

            ## 兼容性
            - Python: 3.8+
            - 支持平台: Claude Code, TRAE, Cursor, OpenCode, Codex, MCP Client
            - 零第三方依赖（纯标准库）

          draft: false
          prerelease: false
